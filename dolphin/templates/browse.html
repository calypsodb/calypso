<div class="">

	<button class="button is-medium is-info is-justify-content-center" hx-get="http://localhost:7777/api/new_pair" hx-swap="innerHTML" hx-target="#canvas_two">New pair</button>
</div>
<table class="table is-bordered is-hoverable is-fullwidth">
	<thead>
		<tr>
			<th>Key</th>
			<th>Value</th>
			<th>Actions</th>
		</tr>
	</thead>
	<tbody>
		{{ range .KeyValueList }}
		<tr id="kv_row_{{ .Key }}">
			<td>{{ .Key }}</td>
			<td>{{ .Value }}</td>
			<td>
				<button class="button is-small is-primary" hx-get="templates/edit_pair.html?key={{ .Key }}&value={{ .Value }}" hx-swap="innerHTML" hx-target="#canvas_two">Edit</button>
				<button class="button is-small is-danger" hx-target="#kv_row_{{ .Key }}" hx-get="/api/delete?key={{ .Key }}">Delete</button>
			</td>
		</tr>
		{{ end }}
	</tbody>
</table>
