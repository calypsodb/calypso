<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CalypsoDB Browser</title>
	<link rel="stylesheet" href="./node_modules/bulma/css/bulma.min.css">
	<link rel="stylesheet" href="./assets/styles/style.css">
</head>

<body>
	<div id="app">
		<nav class="navbar is-flex is-justify-content-space-between" role="navigation" aria-label="main navigation">
			<div class="navbar-brand">
				<a class="navbar-item" href="#">
					<strong>CalypsoDB Browser</strong>
				</a>
			</div>
			<div class="navbar-item">
				<div class="buttons">
					<a class="button is-primary" href="#">
						<strong>Sign up</strong>
					</a>
					<a class="button is-light" href="#">
						Log in
					</a>
				</div>
			</div>
		</nav>
		<section class="main-content columns is-fullheight">
			<aside class="column is-3 is-narrow-mobile is-fullheight section is-hidden-mobile aside-border">
				<ul class="menu-list">
					<li><a href="#" hx-get="http://localhost:7777/api/browse" hx-swap="innerHTML" hx-target="#canvas"><span class="icon"><i data-feather="search"></i></span>Browse db</a></li>
					<li><a href="#"><span class="icon"><i data-feather="bar-chart-2"></i></span>Statistics</a></li>
					<li><a href="#"><span class="icon"><i data-feather="file-text"></i></span>Export db</a></li>
					<li><a href="#"><span class="icon"><i data-feather="upload"></i></span>Import db</a></li>
				</ul>
			</aside>
			<div class="container column is-10">
				<div id="canvas" class="section">
					<div class="card">
						<div class="card-header">
							<p class="card-header-title">Header</p>
						</div>
						<div class="card-content">
							<div class="content">Content</div>
						</div>
					</div>
				</div>
		</section>
		<footer>
			&copy; 2024 CalypsoDB
		</footer>
	</div>
	<script src="./node_modules/htmx.org/dist/htmx.min.js"></script>
	<script src="./node_modules/feather-icons/dist/feather.min.js"></script>
	<script>
		feather.replace();
	</script>
	<script src="./node_modules/eruda/eruda.js"></script>
	<script>eruda.init()</script>
</body>

</html>
